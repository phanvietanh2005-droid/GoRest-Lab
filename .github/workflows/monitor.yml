name: API Monitor

on:
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: npm install -g newman

      - run: |
          newman run collection.json \
          -e environment.json \
          -d users.csv \
          --env-var token=${{ secrets.GOREST_TOKEN }}
